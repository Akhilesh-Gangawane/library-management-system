{% extends "base.html" %}

{% block title %}Book Details - Library Management System{% endblock %}
{% block page_id %}book-detail{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="mb-3">
        <a href="/books" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Books
        </a>
    </div>

    <div id="alert-container"></div>

    <div id="book-detail" class="card p-4" style="display: none;">
        <div class="row g-4">
            <div class="col-md-4 text-center">
                <div class="book-cover-placeholder mb-3" style="height: 280px; font-size: 4rem;">
                    <i class="bi bi-book"></i>
                </div>
                <div id="book-status" class="mb-3"></div>
                <button id="borrow-btn" class="btn btn-primary w-100" style="display: none;">
                    <i class="bi bi-bookmark-plus me-1"></i> Borrow This Book
                </button>
            </div>
            <div class="col-md-8">
                <h2 id="book-title" class="fw-bold mb-2"></h2>
                <h5 class="text-muted mb-3" id="book-author"></h5>

                <div class="table-responsive mb-4">
                    <table class="table table-bordered">
                        <tbody>
                            <tr>
                                <th style="width: 200px;">Category</th>
                                <td id="book-category"></td>
                            </tr>
                            <tr>
                                <th>ISBN</th>
                                <td id="book-isbn"></td>
                            </tr>
                            <tr>
                                <th>Publisher</th>
                                <td id="book-publisher"></td>
                            </tr>
                            <tr>
                                <th>Published Year</th>
                                <td id="book-year"></td>
                            </tr>
                            <tr>
                                <th>Available Copies</th>
                                <td id="book-copies"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <h5 class="fw-semibold">Description</h5>
                <p id="book-description" class="text-secondary" style="line-height: 1.8;"></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/books.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        loadBookDetail({{ book_id }});
    });
</script>
{% endblock %}
