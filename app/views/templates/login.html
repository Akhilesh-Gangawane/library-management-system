{% extends "base.html" %}

{% block title %}Login - Library Management System{% endblock %}
{% block page_id %}login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <h2>Sign In</h2>
        <div id="alert-container"></div>
        <form id="login-form">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
        <p class="text-center mt-3 mb-0" style="font-size: 0.9rem;">
            Don't have an account? <a href="/register">Register here</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
